<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CricVibe - Telegram Channel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        .card {
            background: rgba(15, 32, 39, 0.85);
            border: 2px solid rgba(242, 112, 15, 0.3);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 
                        0 0 25px rgba(242, 112, 15, 0.2);
            backdrop-filter: blur(10px);
            z-index: 1;
        }

        .channel-tag {
            color: #f2700f;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        .title {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(45deg, #f2700f, #ffc371);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #a0aec0;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .timer-container {
            margin-bottom: 35px;
        }

        .countdown {
            font-size: 80px;
            font-weight: 800;
            color: #f2700f;
            line-height: 1;
            text-shadow: 0 0 20px rgba(242, 112, 15, 0.4);
        }

        .timer-label {
            font-size: 12px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
        }

        .btn-join {
            display: inline-block;
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(90deg, #f2700f 0%, #e056fd 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(242, 112, 15, 0.4);
            transition: all 0.3s ease;
        }

        .btn-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(224, 86, 253, 0.5);
            opacity: 0.95;
        }

        .btn-join:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="channel-tag">TELEGRAM CHANNEL</div>
        <h1 class="title">CricVibe</h1>
        <p class="subtitle">Quick access to the channel. Tap below before the timer ends.</p>
        
        <div class="timer-container">
            <div class="countdown" id="timer">8</div>
            <div class="timer-label">SECONDS LEFT</div>
        </div>

        <a href="https://t.me/+zhq6iIEPao1jYjI1" class="btn-join" id="joinBtn">Join Telegram</a>
    </div>

    <script>
        let timeLeft = 8;
        const timerElement = document.getElementById('timer');

        const countdownInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                timerElement.innerText = timeLeft;
            }

            if (timeLeft === 0) {
                clearInterval(countdownInterval);
            }
        }, 1000);
    </script>
</body>
</html>
